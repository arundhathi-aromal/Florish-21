  --bg:#F6F3FF; --surface:#FFFFFF; --ink:#1E1240; --muted:#6B5E96; --line:#E1D9F5;
  --accent:#3B1A78; --accent-ink:#FFFFFF; --on-hc:#FFFFFF; --gold:#8F6410; --glow:.16; color-scheme:light dark;

}

}

  --amb1:#8F7BE0; --amb2:#E08FC8; --amb3:#7FB5F0;
  --c0:#FF9DBF; --c1:#FFC285; --c2:#86E8C4; --c3:#9DB6FF; --c4:#CBA9FF; --c5:#FFE27A; --c6:#86DAF7; --c7:#C4EA7E;

  --c0:#FF9DBF; --c1:#FFC285; --c2:#86E8C4; --c3:#9DB6FF; --c4:#CBA9FF; --c5:#FFE27A; --c6:#86DAF7; --c7:#C4EA7E;
}
:root[data-pal="lilacgrey"] {

  --bg:#F1EFF5; --surface:#FFFFFF; --ink:#3A3548; --muted:#8E889E; --line:#DDD9E8;
  --accent:#B5A8CC; --accent-ink:#2A2438; --on-hc:#2B1D45; --gold:#6E6488; --glow:.5; color-scheme:light;

  --c0:#F38BB1; --c1:#FFB067; --c2:#6FD3B0; --c3:#86A4FF; --c4:#B896FF; --c5:#F2D04F; --c6:#6EC9EE; --c7:#A9D85A;

  --amb1:#BFD3B0; --amb2:#D8E2C0; --amb3:#C0DCCB;
  --c0:#F38BB1; --c1:#FFB067; --c2:#6FD3B0; --c3:#86A4FF; --c4:#B896FF; --c5:#F2D04F; --c6:#6EC9EE; --c7:#A9D85A;

:root[data-pal="coral"] {
  --em:#B8433A;
  --bg:#FFF0EE; --surface:#FFFFFF; --ink:#5A2724; --muted:#BA7F79; --line:#FBD6D1;
  --accent:#FF8F85; --accent-ink:#4A1210; --on-hc:#2B1D45; --gold:#B8433A; --glow:.5; color-scheme:light;

  --c0:#F38BB1; --c1:#FFB067; --c2:#6FD3B0; --c3:#86A4FF; --c4:#B896FF; --c5:#F2D04F; --c6:#6EC9EE; --c7:#A9D85A;

html { scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent; }
.disp { font-family:"Instrument Serif",Georgia,"Times New Roman",serif; font-weight:400; letter-spacing:-0.01em; }
main { position:relative; z-index:1; max-width:520px; margin:0 auto; padding:26px 20px 140px; }
button { font:inherit; color:inherit; cursor:pointer; transition:transform .15s ease, background-color .2s, border-color .2s, box-shadow .2s; }
button:active:not(:disabled) { transform:scale(.96); }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
.muted { color:var(--muted); }
.small { font-size:14px; color:var(--muted); }
.eyebrow { font-size:12px; letter-spacing:.17em; text-transform:uppercase; font-weight:700; color:var(--gold); }
em { font-style:italic; }

/* ambient light */
.ambient { position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.ambient i { position:absolute; width:75vmax; height:75vmax; border-radius:50%; filter:blur(90px); opacity:var(--glow); }
.ambient i:nth-child(1) { background:var(--amb1, var(--c0)); top:-30vmax; left:-25vmax; animation:drift1 26s ease-in-out infinite alternate; }
.ambient i:nth-child(2) { background:var(--amb2, var(--c4)); bottom:-35vmax; right:-30vmax; animation:drift2 32s ease-in-out infinite alternate; }
.ambient i:nth-child(3) { background:var(--amb3, var(--c6)); top:35%; left:55%; width:45vmax; height:45vmax; opacity:calc(var(--glow) * .6); animation:drift3 38s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform:translate(18vmax,12vmax) scale(1.15); } }
@keyframes drift2 { to { transform:translate(-16vmax,-10vmax) scale(1.2); } }
@keyframes drift3 { to { transform:translate(-20vmax,14vmax) scale(.85); } }

/* header */
.hello { font-size:52px; line-height:1; margin:10px 0 12px; overflow-wrap:anywhere; }
.hello em { color:var(--em, var(--accent)); }
.line { margin:12px 0 0; color:var(--muted); font-size:15px; }
.dots { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:22px 0 4px; }
.dots i { width:13px; height:13px; border-radius:50%; border:2px solid var(--hc); transition:background-color .3s, box-shadow .3s; }
.dots i.on { background:var(--hc); box-shadow:0 0 10px var(--hc); }
.dots span { margin-left:6px; font-weight:600; font-size:15px; }
.msg { font-family:"Instrument Serif",Georgia,serif; font-weight:400; font-size:33px; line-height:1.08; margin:22px 0 8px; letter-spacing:-0.01em; overflow-wrap:anywhere; }
.msg.big { font-size:35px; margin:14px 0 6px; }
.why { margin:0; color:var(--muted); font-size:15px; }
.nudge { margin-top:18px; border-radius:16px; padding:14px 16px; background:color-mix(in srgb, var(--accent) 16%, var(--surface)); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent); font-weight:600; font-size:15px; }
.jtoday { display:flex; align-items:center; gap:14px; width:100%; text-align:left; margin-top:20px; padding:16px 18px; border-radius:22px; background:var(--surface); border:1px solid color-mix(in srgb, var(--gold) 45%, transparent); }
.jtoday .jt { flex:1; min-width:0; }
.jtoday .jt b { display:block; font-family:"Instrument Serif",Georgia,serif; font-weight:400; font-size:25px; line-height:1.1; }
.jtoday .jt span.pv { display:block; color:var(--muted); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.jtoday .pen { flex:none; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:color-mix(in srgb, var(--gold) 20%, transparent); color:var(--gold); font-size:20px; }

/* garden tiles */
.garden { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:20px; }
.garden.one { grid-template-columns:1fr; }
.tile { position:relative; border-radius:28px; background:linear-gradient(155deg, color-mix(in srgb, var(--hc) 34%, var(--surface)) 0%, color-mix(in srgb, var(--hc) 9%, var(--surface)) 72%); border:1px solid color-mix(in srgb, var(--hc) 50%, transparent); box-shadow:0 14px 34px -16px color-mix(in srgb, var(--hc) 70%, transparent); }
.tilemain { display:block; width:100%; text-align:left; background:none; border:0; padding:14px 14px 16px; border-radius:28px; }
.bwrap { position:relative; display:grid; place-items:center; margin:2px 6px 8px; }
.bwrap svg { display:block; width:100%; height:auto; }
.tile .petal { stroke-width:2; }
.tile .petal.on { filter:drop-shadow(0 0 5px color-mix(in srgb, var(--hc) 80%, transparent)); }
.tile .hubn { position:absolute; font-family:"Instrument Serif",Georgia,serif; font-size:26px; line-height:1; pointer-events:none; }
.garden.one .tile .hubn { font-size:40px; }
.tname { font-size:17px; font-weight:700; line-height:1.2; overflow-wrap:anywhere; padding-right:50px; }
.tsub { font-size:13px; color:var(--muted); font-weight:500; padding-right:50px; margin-top:2px; }
.tick { position:absolute; right:12px; bottom:12px; width:46px; height:46px; border-radius:50%; border:2px solid var(--hc); background:color-mix(in srgb, var(--surface) 80%, transparent); display:grid; place-items:center; color:transparent; }
.tick svg { width:24px; height:24px; }
.tick.on { background:linear-gradient(135deg, var(--hc), color-mix(in srgb, var(--hc) 70%, #fff)); color:var(--on-hc); box-shadow:0 0 18px color-mix(in srgb, var(--hc) 70%, transparent); }
.tick.pop { animation:tickpop .5s cubic-bezier(.2,1.6,.4,1); }
.tick.pop path { stroke-dasharray:30; animation:draw .45s .08s ease-out both; }
.regrow { position:absolute; right:10px; bottom:10px; border:2px solid var(--hc); background:var(--surface); border-radius:999px; padding:8px 12px; font-weight:700; font-size:13px; }
.add-row { display:block; width:100%; margin-top:14px; background:none; border:1.5px dashed color-mix(in srgb, var(--gold) 55%, transparent); border-radius:22px; padding:16px; font-weight:600; color:var(--gold); }

/* petals */
.petal { fill:color-mix(in srgb, var(--hc) 9%, transparent); stroke:color-mix(in srgb, var(--ink) 26%, transparent); stroke-width:1.5; transform-box:fill-box; transform-origin:50% 100%; }
.petal.future { opacity:.6; }
.petal.now { stroke:var(--hc); stroke-dasharray:4 4; }
.petal.on { stroke:color-mix(in srgb, var(--hc) 55%, #fff); stroke-width:1; stroke-dasharray:none; }
.hero .petal.on { filter:drop-shadow(0 0 7px var(--hc)); }
.enter .petal { animation:petalin .75s cubic-bezier(.2,1.25,.4,1) both; animation-delay:calc(var(--pi, 0) * 26ms + 160ms); }
.petal.pop { animation:petalpop .8s cubic-bezier(.2,1.3,.4,1); animation-delay:0s; }

/* motion */
@keyframes petalpop { from { transform:scale(.05); filter:brightness(2.2); } to { transform:scale(1); } }
@keyframes petalin { from { transform:scale(.1); opacity:0; } to { transform:scale(1); } }
@keyframes tickpop { 0% { transform:scale(.6); } 100% { transform:scale(1); } }
@keyframes draw { from { stroke-dashoffset:30; } to { stroke-dashoffset:0; } }
@keyframes breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
@keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
@keyframes tilein { from { opacity:0; transform:translateY(24px) scale(.94); } to { opacity:1; transform:none; } }
@keyframes grow { from { width:0; } }
@keyframes fall { 0% { transform:translateY(-20px) rotate(0); opacity:1; } 100% { transform:translateY(105vh) rotate(540deg); opacity:.8; } }
@keyframes spark { from { transform:translate(-50%,-50%) scale(1); opacity:1; } to { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2); opacity:0; } }
@keyframes sheetin { from { transform:translateY(100%); } to { transform:none; } }
@keyframes fadein { from { opacity:0; } to { opacity:1; } }
@keyframes chipin { 0% { transform:scale(.8); } 100% { transform:scale(1); } }
@keyframes toastin { from { opacity:0; transform:translate(-50%,16px); } to { opacity:1; transform:translate(-50%,0); } }
@keyframes sway { 0%,100% { transform:rotate(-1.5deg) scale(1); } 50% { transform:rotate(1.5deg) scale(1.025); } }
.enter > *:not(.garden) { animation:rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i, 0) * 55ms); }
.enter .tile { animation:tilein .7s cubic-bezier(.2,.9,.25,1) both; animation-delay:calc(var(--ti, 0) * 90ms + 250ms); }
.enter .jcard { animation:rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--si, 0) * 50ms + 200ms); }
.enter .bar i { animation:grow 1s cubic-bezier(.2,.8,.2,1) both; animation-delay:.3s; }
.enter .hcell i { animation:fadein .5s both; animation-delay:calc(var(--hi, 0) * 14ms + 200ms); }
@media (prefers-reduced-motion: no-preference) {
  .hero .petal.now { animation:breathe 2.6s ease-in-out infinite; }
  .hero svg { animation:sway 14s ease-in-out infinite; }
}
@media (prefers-reduced-motion: reduce) {
  .enter *, .petal.pop, .tick.pop, .tick.pop path, .ambient i { animation:none !important; }
}
.fall { position:fixed; top:-30px; width:14px; height:22px; border-radius:50% 50% 50% 50%/70% 70% 30% 30%; pointer-events:none; z-index:70; animation:fall 2.6s ease-in forwards; }
.spark { position:fixed; width:7px; height:7px; border-radius:50%; pointer-events:none; z-index:70; animation:spark .7s ease-out forwards; }
.toast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:80; background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:999px; font-weight:600; font-size:14px; max-width:90vw; text-align:center; animation:toastin .35s ease-out both; }

/* habit page */
.top { display:flex; justify-content:space-between; align-items:center; min-height:44px; }
.link { background:none; border:0; padding:10px 0; color:var(--muted); font-weight:600; }
.link.strong { color:var(--ink); }
.title { font-size:42px; line-height:1.05; margin:8px 0 4px; overflow-wrap:anywhere; }
.hero { position:relative; display:grid; place-items:center; margin:18px 0 14px; }
.hero::before { content:""; position:absolute; width:66%; aspect-ratio:1; border-radius:50%; background:var(--hc); opacity:.3; filter:blur(52px); }
.hero svg { position:relative; width:min(84vw,320px); height:auto; display:block; }
.hub { position:absolute; text-align:center; pointer-events:none; }
.hub b { display:block; font-family:"Instrument Serif",Georgia,serif; font-weight:400; font-size:52px; line-height:.9; }
.hub span { font-size:12px; color:var(--muted); font-weight:600; }
.btn { display:block; width:100%; border:0; border-radius:16px; padding:17px; font-weight:700; font-size:17px; background:var(--accent); color:var(--accent-ink); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 10px 26px -12px var(--accent); }

    var h;
    if (d.id) { h = get(d.id); Object.keys(fields).forEach(function (k) { h[k] = fields[k]; }); }
    else { h = { id: "h" + Date.now(), created: today(), blooms: 0, days: {} }; Object.keys(fields).forEach(function (k) { h[k] = fields[k]; }); state.habits.push(h); }
    save(); view.screen = "habit"; view.id = h.id; view.sel = Math.max(0, Math.min(goalOf(h) - 1, ti(h))); view.draft = null;
    return true;
  }

  /* ---------- you ---------- */
  function renderYou(app) {
    var out = '<div class="eyebrow">Settings</div><h1 class="hello disp">Make it <em>yours</em></h1>';
    out += '<div><label class="l" for="nm" style="margin-top:20px">What should I call you?</label><input type="text" id="nm" maxlength="30" placeholder="Your name" value="' + esc(state.name) + '"></div>';

    out += '<div><h2 class="sec disp">Look and feel</h2><label class="l" style="margin-top:12px">Theme</label><div class="pals">';
    PALS.forEach(function (p) {
      var dd = PALDATA[p[0]], pb, pa, dots;
      if (p[0] === "auto") { pb = "linear-gradient(110deg,#0D0820 50%,#F6F3FF 50%)"; pa = "#F4C95D"; dots = PDOTS.vd; }
      else { pb = dd[0]; pa = dd[1]; dots = PDOTS[dd[2]]; }
      out += '<button class="pal' + (state.pal === p[0] ? " on" : "") + '" data-act="pal" data-v="' + p[0] + '" aria-label="' + p[1] + ' theme" style="--pb:' + pb + ';--pa:' + pa + '"><span class="pv">' + dots.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join("") + '<b></b></span>' + p[1] + '</button>';
    });
    out += '</div><label class="l">Petal shape</label><div class="chips">';
    SHAPES.forEach(function (p) { out += '<button class="chip' + (state.shape === p[0] ? " on" : "") + '" data-act="shape" data-v="' + p[0] + '">' + p[1] + '</button>'; });
    out += '</div></div>';

    out += '<div><h2 class="sec disp">Journal</h2><p class="hint" style="margin-top:4px">Each new day, the app asks you to describe it when you open it.</p><div class="chips"><button class="chip' + (state.journalAsk ? " on" : "") + '" data-act="jask">' + (state.journalAsk ? "Asking me every day" : "Not asking") + '</button></div></div>';

    out += '<div><h2 class="sec disp">Your words</h2>';
    out += '<label class="l" for="af" style="margin-top:12px">Encouragement</label><textarea id="af" placeholder="One per line. They join the daily lines on Today." style="min-height:100px">' + esc((state.affirm || []).join("\n")) + '</textarea>';
    out += '<label class="l" for="tp">Countdown messages</label><textarea id="tp" placeholder="One per line, e.g. {n} more days, {name}! {habit} is almost yours." style="min-height:100px">' + esc((state.templates || []).join("\n")) + '</textarea><p class="hint">Use {name}, {n} (days left), {habit}, {done} and {goal}. If you add any, they replace the built-in ones. The final days still get their special messages.</p></div>';

    out += '<div><h2 class="sec disp">Reminders</h2><p class="hint" style="margin-top:4px">Each habit has its own reminders. Open a habit and tap Edit.</p><div class="chips">';
    var p = permission();
    if (p === "default") out += '<button class="chip" data-act="perm">Allow notifications</button>';
    else if (p === "granted") out += '<span class="chip on">Notifications allowed</span>';
    else if (p === "denied") out += '<span class="chip">Notifications blocked in browser settings</span>';
    out += '<button class="chip" data-act="ics-all">Add all reminders to my phone calendar</button></div></div>';

    out += '<div><h2 class="sec disp">Your data</h2><p class="hint" style="margin-top:4px">Everything lives on this device. Save a backup now and then.</p><div class="chips"><button class="chip" data-act="export">Save a backup</button><button class="chip" data-act="import">Restore from backup</button></div></div>';
    app.innerHTML = out;

    document.getElementById("nm").addEventListener("input", function (e) { state.name = e.target.value.trim(); save(); });
    document.getElementById("af").addEventListener("input", function (e) { state.affirm = e.target.value.split("\n").map(function (x) { return x.trim(); }).filter(Boolean); save(); });
    document.getElementById("tp").addEventListener("input", function (e) { state.templates = e.target.value.split("\n").map(function (x) { return x.trim(); }).filter(Boolean); save(); });
  }

  /* ---------- events ---------- */
  function leaveEntry() { if (view.screen === "entry") jclean(view.entryDate); }
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act"), id = t.getAttribute("data-id"), h;
    var d = view.draft;

    /* journal chips update in place so the keyboard and text stay put */
    if (act === "jmood") {
      var je = jensure(view.jdate), m0 = t.getAttribute("data-m"); je.mood = je.mood === m0 ? "" : m0; save();
      document.getElementById("jmoods").innerHTML = moodsHtml(view.jdate); return;
    }
    if (act === "jtag") {
      var jt = jensure(view.jdate), tg = t.getAttribute("data-t"), ix0 = jt.tags.indexOf(tg);
      if (ix0 >= 0) jt.tags.splice(ix0, 1); else jt.tags.push(tg);
      save(); document.getElementById("jtags").innerHTML = tagsHtml(view.jdate); return;
    }
    if (act === "jstart") {
      var ta = document.getElementById("jtext"), s = STARTERS[+t.getAttribute("data-i")];
      ta.value = (ta.value && !/\s$/.test(ta.value) ? ta.value + "\n" : ta.value) + s + " ";
      jensure(view.jdate).text = ta.value; save(); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); return;
    }
    if (act === "jsave" || act === "jlater") {
      var kk = view.jdate, has = !jempty(jget(kk));
      jclean(kk); state.askedOn = today(); save(); view.prompt = false;
      if (act === "jsave" && has) { toast("Saved to your Journals"); celebrateColor(getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#F4C95D", 16); }
      render(); return;
    }

    if (act !== "delete" && act !== "jdel") view.confirmDel = false;

    if (act === "go") { leaveEntry(); view.screen = t.getAttribute("data-to"); view.draft = null; }
    else if (act === "new") { leaveEntry(); openForm(null); }
    else if (act === "edit") openForm(get(id));
    else if (act === "cancel") { view.screen = d && d.id ? "habit" : "today"; if (d && d.id) view.id = d.id; view.draft = null; }
    else if (act === "save") { if (!saveDraft()) return; }
    else if (act === "welcome") {
      var nm = document.getElementById("who").value.trim();
      if (!nm) { document.getElementById("who").focus(); return; }
      state.name = nm; state.skipWelcome = true; save(); view.screen = "today";
    }
    else if (act === "skipwelcome") { state.skipWelcome = true; save(); view.screen = "today"; }
    else if (act === "open") { h = get(id); view.screen = "habit"; view.id = id; view.sel = Math.max(0, Math.min(goalOf(h) - 1, ti(h))); }
    else if (act === "tick") {
      h = get(id); var i = ti(h);
      if (i >= 0 && i < goalOf(h)) {
        var was = isDone(h, today()), r = t.getBoundingClientRect();
        toggleDay(h, i);
        if (!was) burst(r.left + r.width / 2, r.top + r.height / 2, habitColor(h));
      }
    }
    else if (act === "toggle-sel") toggleDay(get(view.id), view.sel);
    else if (act === "sel") view.sel = +t.getAttribute("data-i");
    else if (act === "mood") { h = get(view.id); var e = h.days[addDays(h.start, view.sel)], m = t.getAttribute("data-m"); if (e) { e.mood = e.mood === m ? "" : m; save(); } }
    else if (act === "regrow") { h = get(id); h.blooms = (h.blooms || 0) + 1; h.start = today(); view.sel = 0; save(); view.screen = "habit"; view.id = id; }
    else if (act === "jopen") { view.entryDate = t.getAttribute("data-d"); view.jdate = view.entryDate; view.screen = "entry"; }
    else if (act === "jback") { jclean(view.entryDate); view.screen = "journals"; }
    else if (act === "jnav") {
      jclean(view.entryDate);
      var nd = addDays(view.entryDate, +t.getAttribute("data-dir"));
      if (nd > today()) return;
      view.entryDate = nd; view.jdate = nd; view.confirmDel = false; render(true); return;
    }
    else if (act === "jdel") {
      if (!view.confirmDel) view.confirmDel = true;
      else { delete state.journal[view.entryDate]; save(); view.confirmDel = false; view.screen = "journals"; toast("Entry deleted"); }
    }
    else if (act === "jfilter") view.jfilter = t.getAttribute("data-m");
    else if (act === "jask") { state.journalAsk = !state.journalAsk; save(); }
    else if (act === "suggest") { var inp = document.getElementById("f-name"); inp.value = t.getAttribute("data-text"); d.name = inp.value; syncDraft(); render(); return; }
    else if (act === "femoji") { syncDraft(); var em = t.getAttribute("data-e"); d.emoji = d.emoji === em ? "" : em; }
    else if (act === "fcolor") { syncDraft(); d.custom = ""; d.color = +t.getAttribute("data-c"); }
    else if (act === "fgoal") { syncDraft(); d.goal = +t.getAttribute("data-g"); }
    else if (act === "fstep") { syncDraft(); d.goal = Math.max(3, Math.min(100, d.goal + (+t.getAttribute("data-s")))); }
    else if (act === "radd") { syncDraft(); d.reminders.push({ id: "r" + Date.now() + Math.floor(Math.random() * 99), time: "20:00", days: [0, 1, 2, 3, 4, 5, 6] }); }
    else if (act === "rdel") { syncDraft(); var rid = t.getAttribute("data-r"); d.reminders = d.reminders.filter(function (r) { return r.id !== rid; }); }
    else if (act === "rtime") { syncDraft(); var rr = d.reminders.filter(function (x) { return x.id === t.getAttribute("data-r"); })[0]; if (rr) rr.time = t.getAttribute("data-t"); }
    else if (act === "rday") {
      syncDraft();
      var r2 = d.reminders.filter(function (x) { return x.id === t.getAttribute("data-r"); })[0], dn = +t.getAttribute("data-d"), ix = r2.days.indexOf(dn);
      if (ix >= 0) r2.days.splice(ix, 1); else r2.days.push(dn);
    }
    else if (act === "ics-one") { syncDraft(); exportIcs([{ id: d.id || "new", name: d.name || "Habit", emoji: d.emoji, remMsg: d.remMsg, goal: d.goal, start: d.start, days: {}, reminders: d.reminders }], "twentyone-" + (d.name || "habit").toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".ics"); return; }
    else if (act === "ics-all") { exportIcs(state.habits, "twentyone-reminders.ics"); return; }
    else if (act === "perm") { try { Notification.requestPermission().then(function () { render(); }); } catch (x) {} return; }
    else if (act === "test") { syncDraft(); notify({ id: d.id || "new", name: d.name || "Your habit", emoji: d.emoji, remMsg: d.remMsg, goal: d.goal, start: d.start, days: {} }, "This is how your reminder will look."); return; }
    else if (act === "pal") { state.pal = t.getAttribute("data-v"); save(); applyTheme(); }
    else if (act === "shape") { state.shape = t.getAttribute("data-v"); save(); }
    else if (act === "export") { download("twentyone-backup-" + today() + ".json", JSON.stringify(state, null, 2), "application/json"); toast("Backup saved to your downloads."); return; }
    else if (act === "import") { document.getElementById("importfile").click(); return; }
    else if (act === "delete") {
      if (!view.confirmDel) view.confirmDel = true;
      else { state.habits = state.habits.filter(function (x) { return x.id !== d.id; }); save(); view.confirmDel = false; view.draft = null; view.screen = "today"; }
    }
    render();
  });

  document.getElementById("importfile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var p = JSON.parse(rd.result);
        if (!p || !Array.isArray(p.habits)) throw new Error("bad");
        adopt(p); state.skipWelcome = true; save(); applyTheme(); view.screen = "today"; toast("Backup restored."); render();
      } catch (x) { toast("That file doesn't look like a Twenty-one backup."); }
    };
    rd.readAsText(f); e.target.value = "";
  });

  /* ---------- start ---------- */
  load(); applyTheme(); render();
  setTimeout(maybePrompt, 900);
  setInterval(dueNow, 20000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { dueNow(); maybePrompt(); } });
  if (window.matchMedia) { try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); } catch (e) {} }
  try { if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
})();
</script>
</body>
</html>
